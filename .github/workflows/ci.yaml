name: pipeline for training and dumping the model

on: 
  push: 
   branches: [main]
  pull_request:
   branches: [main]
jobs: 
  Matrix_stratergy:
    name: python-model
    runs-on: ubuntu-latest
    stratergy: 
       matrix:
         python: [3.12,3,13]
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v4
      with: 
        python-version : {{matrix.python}}

    - name: upgrade pip
      run: python -m pip install --upgrade pip wheel setuptools

    - name: install dependecies
      run: python -m pip install -r requirement.txt

    - name: Train the model
      run : |
         python train.py
         ls -la artifacts

    - name: publish artifacts 
      uses: actions/upload-artifacts@v4
      with : 
        name: Ml_Model-${{matrix.python}}-{{github.runid}}
        path: artifacts

  