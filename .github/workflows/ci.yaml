name: pipeline for training and dumping the model

on: 
  push: 
   branches: [main]
  pull_request:
   branches: [main]
jobs: 
  matrix_build:
    name: python-model-${{matrix.python}}
    runs-on: ubuntu-latest
    strategy: 
       matrix:
         python: [3.12,3.13]
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v4
      with: 
        python-version : ${{matrix.python}}

    - name: upgrade pip
      run: python -m pip install --upgrade pip wheel setuptools

    - name: install dependecies
      run: python -m pip install -r requirements.txt

    - name: Train the model
      run : |
        name: pipeline for training and dumping the model

        on:
          push:
            branches: [ main ]
          pull_request:
            branches: [ main ]

        jobs:
          build:
            name: Python model - ${{ matrix.python }}
            runs-on: ubuntu-latest
            strategy:
              matrix:
                python: [ "3.12", "3.13" ]
            steps:
              - name: Checkout
                uses: actions/checkout@v4

              - name: Set up Python
                uses: actions/setup-python@v4
                with:
                  python-version: ${{ matrix.python }}

              - name: Upgrade pip
                run: python -m pip install --upgrade pip wheel setuptools

              - name: Install dependencies
                run: python -m pip install -r requirements.txt

              - name: Train the model
                run: |
                  python train.py
                  ls -la artifacts

              - name: Upload artifacts
                uses: actions/upload-artifact@v4
                with:
                  name: Ml_Model-${{ matrix.python }}-${{ github.run_id }}
                  path: artifacts

